# The example island with shapes only: the same map and relief as style.yaml, without decoration
# (no facades, roofs, materials, plants or models). Compare the two to see what decoration adds.
units: m
environment: {sun: [235, 38], water_level: 0, vertical_scale: 1.5}
terrain:
  color: "#d8c9a0"
  bands:
    - {above: 3, color: "#7f9a52", blend: 4}
    - {above: 95, color: "#9e9e99", blend: 20}
relations:
  facing: {when: {kind: [street, road]}, reach: 20}
rules:
  - when: {kind: beach}
    shape: {role: ground, lift: 0.05}
    color: "#e6d8b0"
  - when: {kind: square}
    shape: {role: ground, lift: 0.15}
    color: "#cfc4ae"
  - when: {kind: [street, road, path]}
    shape: {role: ground, width: "width", lift: 0.1}
    color: "#d9cfb8"
  - when: {kind: [garden, forest]}
    shape: {role: ground, lift: 0.05}
    color: "#6f8f45"
  - when: {kind: river}
    shape: {role: water, width: "width", above_bed: 1.5}
    color: "#2f6f8f"
  - when: {kind: bridge}
    shape: {role: line, follow: level, thickness: "width", height: 0.6, sink: 0.8}
    color: "#a39a8a"
  - when: {kind: building}
    shape: {role: volume, height: "3.5 + (floors - 1) * 3"}
    walls: {color: "#e9dfc9"}
    roof: {recipe: flat, color: "#e9dfc9"}
  - when: {kind: tower}
    shape: {role: point, size: 6, height: "height", form: round}
    walls: {color: "#d9d2c3"}
    roof: {recipe: flat, color: "#d9d2c3"}
  - when: {kind: tower, id: bell-tower}
    shape: {size: 5, height: 16, form: square}
  - when: {kind: lamp}
    shape: {role: none}
