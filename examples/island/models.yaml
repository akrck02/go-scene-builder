# Small models the style sows and places: built once, drawn as instances. Metres, y up.
models:
  fir:
    variants: 3
    vary: {color: 0.1, warmth: 0.05, scale: [0.8, 1.2]}
    parts:
      - {shape: cylinder, radius: 0.25, top_radius: 0.15, height: 2, color: "#5a4030"}
      - {shape: cone, radius: 2.2, height: 5, at: [0, 1.5, 0], move: 0.2, grow: 0.15, color: "#3f5a35", material: {foliage: true}}
      - {shape: cone, radius: 1.6, height: 4, at: [0, 4, 0], move: 0.2, grow: 0.15, color: "#466340", material: {foliage: true}}
  broadleaf:
    variants: 4
    vary: {color: 0.12, warmth: 0.06, scale: [0.8, 1.3]}
    parts:
      - {shape: cylinder, radius: 0.3, top_radius: 0.2, height: 3, color: "#5a4030"}
      - {shape: blob, size: [5, 4.5, 5], at: [0, 4.5, 0], wobble: 0.15, move: 0.6, grow: 0.2, color: "#56713a", material: {foliage: true}}
  lamp:
    parts:
      - {shape: cylinder, radius: 0.08, height: 3.5, color: "#2b2b2b"}
      - {shape: box, size: [0.4, 0.5, 0.4], at: [0, 3.5, 0], color: "#ffd27a", material: {kind: glow}}
