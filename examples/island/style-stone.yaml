# The example island in stone: the same map and relief as style.yaml, only the rules for the
# houses and the tower change. Stone walls, slate hip roofs, frames around the windows.
units: m
chunk: 0.5
environment: {sun: [235, 38], water_level: 0, vertical_scale: 1.5}
models: [models.yaml]
terrain:
  color: "#d8c9a0"                       # sand by the sea
  bands:
    - {above: 3, color: "#7f9a52", blend: 4}     # grass
    - {above: 95, color: "#9e9e99", blend: 20}   # rock on the hilltop
relations:
  facing: {when: {kind: [street, road]}, reach: 20}
  rows: {tolerance: 0.4}
rules:
  - when: {kind: beach}
    shape: {role: ground, lift: 0.05}
    color: "#e6d8b0"
  - when: {kind: square}
    shape: {role: ground, lift: 0.15}
    color: "#cfc4ae"
    material: {pattern: cobbles, scale: 0.35}
  - when: {kind: street}
    shape: {role: ground, width: "width", lift: 0.12}
    color: ["#e6dcc4", "#ddd2b8"]
    material: {pattern: cobbles, scale: 0.35}
  - when: {kind: road}
    shape: {role: ground, width: "width", lift: 0.1}
    color: "#bdb29a"
  - when: {kind: path}
    shape: {role: ground, width: "width", lift: 0.08}
    color: "#c9b48a"
  - when: {kind: garden}
    shape: {role: ground, lift: 0.06}
    color: "#6f8f45"
    material: {pattern: grass, scale: 0.5}
    decorate:
      - {recipe: plants, density: 0.03, trees: 0.2, beds: 0.3, tree_height: [4, 7], clear: 1.5,
         foliage: ["#4f6b35", "#5d7a3c"], flowers: ["#d2453c", "#e8c547", "#f2f0e8"], trunk: "#5a4030"}
  - when: {kind: forest}
    shape: {role: ground, lift: 0.5}
    color: "#5b6a49"
    decorate:
      - {recipe: scatter, density: 0.004, models: {fir: 2, broadleaf: 1}, turn: random}
  - when: {kind: river}
    shape: {role: water, width: "width", above_bed: 1.5}
    color: "#2f6f8f"
  - when: {kind: bridge}
    shape: {role: line, follow: level, thickness: "width", height: 0.6, sink: 0.8}
    color: "#a39a8a"
    material: {pattern: masonry, scale: 0.5}
  - when: {kind: building}
    shape: {role: volume, height: "3 + (floors - 1) * 2.8"}
    walls: {color: ["#a69c8c", "#9b9284", "#b0a594"], material: {pattern: masonry, scale: 0.4}}
    roof: {recipe: hip, pitch: 30, eaves: 0.3, color: ["#4a4f57", "#545a62"],
           material: {pattern: shingles, scale: 0.25}, chimneys: {share: 0.6, width: 0.7, above: 1.2}}
    stonework: {plinth: 0.8, quoins: {width: 0.45}}
    facade:
      door: {round: 0.8, color: "#3b2a1c"}
      windows: {shutters: "#2f3a2f"}
      frames: {width: 0.15}
      ivy: {share: 0.3}
      lamp: {share: 0.6}
      sides: {spacing: 4.5}
  - when: {kind: tower}
    shape: {role: point, size: 6, height: "height", form: round}
    walls: {color: "#d9d2c3", material: {pattern: masonry, scale: 0.6}}
    roof: {recipe: hip, pitch: 50, color: "#4a4f57"}
  - when: {kind: tower, id: bell-tower}
    shape: {size: 5, height: 16, form: square}
  - when: {kind: lamp}
    shape: {role: model, model: lamp}
