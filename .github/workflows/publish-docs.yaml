# Publishes docs/ as a website on GitHub Pages with papiro (https://github.com/akrck02/papiro-deploy).
name: Publish documents
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: akrck02/papiro-deploy@main
        with:
          title: "go-scene-builder"
          description: "3D scenes from 2D maps, reliefs and style rules"
          path: "./docs"
          isObsidianProject: false
          showFooter: true
          showBreadcrumb: true
          showStartPage: true
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.3.0
        with:
          branch: gh-pages
          folder: .
