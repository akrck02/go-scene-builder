<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .accent { fill: #ddf4ff; stroke: #54aeff; }
    .stage { fill: #ffffff; stroke: #54aeff; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .small { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .text { fill: #59636e; font-size: 12.5px; }
    .code { fill: #0969da; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .label { fill: #59636e; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .arrow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .head { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .accent { fill: #0c2d4b; stroke: #1f6feb; }
      .stage { fill: #0d1117; stroke: #1f6feb; }
      .title { fill: #e6edf3; }
      .small { fill: #e6edf3; }
      .text { fill: #9198a1; }
      .code { fill: #4493f8; }
      .label { fill: #9198a1; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="400" rx="12"/>

  <!-- inputs -->
  <rect class="box" x="20" y="24" width="180" height="80" rx="10" stroke-width="1.2"/>
  <text class="code" x="36" y="50">map.geojson</text>
  <text class="small" x="36" y="72">The map: what is where</text>
  <text class="text" x="36" y="91">features with id and kind</text>

  <rect class="box" x="20" y="120" width="180" height="80" rx="10" stroke-width="1.2"/>
  <text class="code" x="36" y="146">relief.json + .f32</text>
  <text class="small" x="36" y="168">The relief: how high</text>
  <text class="text" x="36" y="187">a grid of heights (optional)</text>

  <rect class="box" x="20" y="216" width="180" height="80" rx="10" stroke-width="1.2"/>
  <text class="code" x="36" y="242">style.yaml</text>
  <text class="small" x="36" y="264">Style rules: the looks</text>
  <text class="text" x="36" y="283">a cascade, + model libraries</text>

  <rect class="box" x="20" y="312" width="180" height="64" rx="10" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text class="code" x="36" y="338">-layer biome=…</text>
  <text class="text" x="36" y="358">grids of categories (optional)</text>

  <path class="arrow" d="M200,64 C228,64 228,180 254,180" marker-end="url(#arrow)"/>
  <path class="arrow" d="M200,160 C224,160 230,180 254,180" marker-end="url(#arrow)"/>
  <path class="arrow" d="M200,256 C228,256 228,200 254,200" marker-end="url(#arrow)"/>
  <path class="arrow" d="M200,344 C232,344 232,210 254,210" marker-end="url(#arrow)"/>

  <!-- the builder -->
  <rect class="accent" x="258" y="24" width="370" height="352" rx="12" stroke-width="1.4"/>
  <text class="code" x="443" y="52" text-anchor="middle">build-scene</text>
  <text class="title" x="443" y="74" text-anchor="middle">The builder: four stages</text>

  <rect class="stage" x="278" y="92" width="330" height="58" rx="8" stroke-width="1.2"/>
  <text class="small" x="294" y="116">1 · Basic blocks</text>
  <text class="text" x="294" y="136">terrain, draped ground, level water, volumes, lines</text>
  <path class="arrow" d="M443,150 V160" marker-end="url(#arrow)"/>

  <rect class="stage" x="278" y="164" width="330" height="58" rx="8" stroke-width="1.2"/>
  <text class="small" x="294" y="188">2 · Relations</text>
  <text class="text" x="294" y="208">what faces a street, shared walls, gates in walls</text>
  <path class="arrow" d="M443,222 V232" marker-end="url(#arrow)"/>

  <rect class="stage" x="278" y="236" width="330" height="58" rx="8" stroke-width="1.2"/>
  <text class="small" x="294" y="260">3 · Style rules</text>
  <text class="text" x="294" y="280">general first, specific after: the last match wins</text>
  <path class="arrow" d="M443,294 V304" marker-end="url(#arrow)"/>

  <rect class="stage" x="278" y="308" width="330" height="58" rx="8" stroke-width="1.2"/>
  <text class="small" x="294" y="332">4 · Decoration</text>
  <text class="text" x="294" y="352">roofs, facades, plants, models, rivers, bridges</text>

  <!-- outputs -->
  <path class="arrow" d="M628,200 H668" marker-end="url(#arrow)"/>
  <rect class="box" x="672" y="120" width="188" height="160" rx="10" stroke-width="1.2"/>
  <text class="code" x="688" y="148">scene.glb</text>
  <text class="small" x="688" y="170">A 3D scene</text>
  <text class="text" x="688" y="192">binary glTF 2.0, quantised,</text>
  <text class="text" x="688" y="209">pieces in chunks, levels</text>
  <text class="text" x="688" y="226">of detail, sun and sea</text>
  <text class="text" x="688" y="243">in its extras</text>

  <path class="arrow" d="M766,280 V318" marker-end="url(#arrow)"/>
  <text class="label" x="776" y="304">open</text>
  <rect class="box" x="672" y="322" width="188" height="54" rx="10" stroke-width="1.2"/>
  <text class="small" x="688" y="345">go-renderer's viewer</text>
  <text class="text" x="688" y="364">orbit, walk, day or night</text>

  <text class="label" x="766" y="60" text-anchor="middle">or, as a library,</text>
  <text class="label" x="766" y="78" text-anchor="middle">pieces for a live scene</text>
  <path class="arrow" d="M640,140 C650,100 690,90 700,90" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
</svg>
